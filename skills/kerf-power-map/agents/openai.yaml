interface:
  display_name: "Power Map"
  short_description: "Workplace power strategist grounded in evidence, interests, and real-world cases"
  default_prompt: "Use $kerf-power-map to clarify my real goal and fixed constraints, decode who actually decides using relevant book mechanisms and cases, and give me a concrete move ladder with ready-to-use wording and an inline map when first recommending a strategy, including the reply after intake answers; carry undelivered maps across acknowledgements, reuse delivered maps on follow-ups, and update only affected parts when facts change."
policy:
